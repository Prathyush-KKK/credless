# Release: Changesets opens and maintains a "Version packages" pull request on main; merging it publishes `credless`
# to npm through trusted publishing (OIDC, no npm token anywhere) with provenance, and attests the tarball with
# GitHub's build provenance. Nothing here needs a secret of ours: the only token is the workflow's own.
#
# Before launch (plan T11): pin every `uses:` below to a commit SHA (Renovate's helpers:pinGitHubActionDigests keeps
# them current), and register this workflow file as the trusted publisher of the `credless` package on npmjs.com
# (package settings > Trusted publishing: owner Prathyush-KKK, repository credless, workflow release.yml).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version PR or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the version PR, the release tags and the GitHub releases
      pull-requests: write # the version PR
      id-token: write # npm trusted publishing and the build attestation
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@v4 # TODO before launch: pin to a SHA
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v4 # TODO before launch: pin to a SHA; the pnpm version comes from packageManager

      - uses: actions/setup-node@v4 # TODO before launch: pin to a SHA
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install (frozen lockfile, no install scripts)
        run: pnpm install --frozen-lockfile

      - name: Check, build and verify the package shape
        run: |
          pnpm check
          pnpm build
          pnpm pack:check

      - name: Version PR, or publish on merge
        id: changesets
        uses: changesets/action@v1 # TODO before launch: pin to a SHA
        with:
          title: 'Version packages'
          commit: 'Version packages'
          version: pnpm changeset version
          # `changeset publish` runs `npm publish` per package; packages/kit/package.json carries
          # publishConfig { access: public, provenance: true }, so this is `npm publish --provenance --access public`
          # through pnpm's environment, with the npm CLI exchanging the job's OIDC token for a short-lived credential.
          publish: pnpm changeset publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Pack the published tarball for attestation
        if: steps.changesets.outputs.published == 'true'
        run: |
          mkdir -p .release
          pnpm --filter ./packages/kit pack --pack-destination "$GITHUB_WORKSPACE/.release"
          ls -l .release

      - name: Attest build provenance of the tarball
        if: steps.changesets.outputs.published == 'true'
        uses: actions/attest-build-provenance@v2 # TODO before launch: pin to a SHA
        with:
          subject-path: .release/*.tgz
